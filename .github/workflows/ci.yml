name: Hari AI Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  backend-ci:
    name: Backend Test and Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate JSON
        run: |
          python -m json.tool backend/knowledge.json > /dev/null
          python -m json.tool backend/knowledge_config.json > /dev/null

      - name: Build Docker image
        run: |
          docker build \
            -t hari-portfolio-api:ci \
            ./backend

      - name: Run unit tests
        run: |
          docker run --rm \
            --entrypoint python \
            hari-portfolio-api:ci \
            -m unittest discover -s tests -v

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io \
            -u "$GITHUB_ACTOR" \
            --password-stdin

      - name: Tag Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"

          docker tag hari-portfolio-api:ci \
            "$IMAGE_NAME:$GITHUB_SHA"

          docker tag hari-portfolio-api:ci \
            "$IMAGE_NAME:latest"

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"

          docker push "$IMAGE_NAME:$GITHUB_SHA"
          docker push "$IMAGE_NAME:latest"

      - name: CI completed
        run: echo "Hari AI CI and Docker publishing completed successfully"
